name: Refresh profile visuals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#2563eb
            dist/snake-dark.svg?palette=github-dark&color_snake=#60a5fa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&title_color=111827&text_color=374151&icon_color=2563eb&bg_color=ffffff
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate dark activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&title_color=f0f6fc&text_color=c9d1d9&icon_color=60a5fa&bg_color=0d1117
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=5&hide_border=true&title_color=111827&text_color=374151&bg_color=ffffff
          path: dist/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=5&hide_border=true&title_color=f0f6fc&text_color=c9d1d9&bg_color=0d1117
          path: dist/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Publish generated SVGs to the disposable output branch
        shell: bash
        run: |
          set -euo pipefail
          for file in snake.svg snake-dark.svg stats.svg stats-dark.svg languages.svg languages-dark.svg; do
            test -s "dist/$file"
          done
          saved="$(mktemp -d)"
          cp dist/*.svg "$saved/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan rendered-output
          git rm -rf --ignore-unmatch .
          mkdir -p profile
          cp "$saved/"*.svg profile/
          git add profile/*.svg
          git commit -m 'Refresh profile visuals'
          git push --force origin HEAD:output
