name: Refresh profile visuals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#2563eb
            dist/snake-dark.svg?palette=github-dark&color_snake=#60a5fa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated SVGs to the disposable output branch
        shell: bash
        run: |
          set -euo pipefail
          for file in snake.svg snake-dark.svg; do
            test -s "dist/$file"
          done
          saved="$(mktemp -d)"
          cp dist/*.svg "$saved/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan rendered-output
          git rm -rf --ignore-unmatch .
          mkdir -p profile
          cp "$saved/"*.svg profile/
          git add profile/*.svg
          git commit -m 'Refresh profile visuals'
          git push --force origin HEAD:output
